<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><span class="brand">NEXUS</span><span id="mode">CORE ONLINE</span></header><section class="hud"><div class="service left"><b>CALENDAR</b><span class="offline">ADAPTER READY</span><b>GMAIL</b><span class="offline">ADAPTER READY</span></div><div class="center"><div class="orbit o3"></div><div class="orbit o2"></div><div class="orbit o1"></div><div id="core"><div class="core-inner">N</div></div><canvas id="wave" width="650" height="100"></canvas><h1>NEXUS</h1><p id="status">STANDBY</p><p id="detail">Push-to-Talk to begin</p></div><div class="service right"><b>OPENAI</b><span class="online">CONNECTED</span><b>NOTION</b><span class="offline">ADAPTER READY</span></div></section><section class="console"><div id="conversation" aria-live="polite"><p class="system">NEXUS Core ready.</p></div><div class="controls"><button id="ptt" aria-label="Push to Talk">HOLD TO TALK</button><input id="text" placeholder="または、ここに話しかけてください" autocomplete="off"><button id="send">SEND</button></div></section></main><dialog id="approval"><h2>承認が必要です</h2><p id="approvalText"></p><div><button id="deny">CANCEL</button><button id="confirm">APPROVE</button></div></dialog><script src="/app.js"></script></body></html>
